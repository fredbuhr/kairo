services:
  searxng:
    profiles: !reset []
  valkey:
    profiles: !reset []
  nevolium-web-mcp:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
      args:
        NEVOLIUM_WORKER_EXTRAS: ""
    init: true
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    stop_grace_period: 20s
    restart: unless-stopped
    command: ["python", "-m", "nevolium_worker.web_mcp"]
    environment:
      SEARXNG_URL: http://searxng:8080
    depends_on:
      searxng:
        condition: service_started
    networks: [nevolium]

  nevolium-worker:
    environment:
      NEVOLIUM_WEB_MCP_URL: http://nevolium-web-mcp:8090/mcp
      NEVOLIUM_ADMIN_TOKEN: ${NEVOLIUM_ADMIN_TOKEN:-}
    depends_on:
      nevolium-web-mcp:
        condition: service_started
