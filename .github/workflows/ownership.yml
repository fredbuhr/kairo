name: Ownership isolation validation

on:
  push:
    paths:
      - 'services/core/**'
      - 'services/worker/**'
      - 'infrastructure/keycloak/**'
      - 'infrastructure/openbao/**'
      - 'scripts/smoke/multi_user_ownership.py'
      - 'scripts/smoke/multi_user_conversation_ownership.py'
      - 'scripts/smoke/multi_user_secret_ownership.py'
      - 'scripts/smoke/multi_user_tool_invocation_ownership.py'
      - 'scripts/smoke/multi_user_asset_document_ownership.py'
      - 'scripts/smoke/multi_user_account_lifecycle.py'
      - 'scripts/smoke/tool_invocation_ownership_contract.py'
      - 'scripts/smoke/asset_document_ownership_contract.py'
      - 'scripts/smoke/evidence_subject_contract.py'
      - 'scripts/smoke/evidence_retention_contract.py'
      - 'scripts/smoke/outbox_jetstream_retention_contract.py'
      - 'scripts/smoke/internal_task_start_contract.py'
      - 'scripts/smoke/keycloak_identity_boundary_contract.py'
      - 'scripts/smoke/openbao_policy_contract.py'
      - 'scripts/smoke/control_plane_visibility.py'
      - 'compose.yaml'
      - 'compose.override.yaml'
      - '.env.example'
      - 'docs/decisions/ADR-040-canonical-world-is-scoped-by-authenticated-subject.md'
      - 'docs/decisions/ADR-041-secret-references-are-subject-owned-write-only-vault-handles.md'
      - 'docs/decisions/ADR-042-tool-invocations-are-subject-owned-execution-state.md'
      - 'docs/decisions/ADR-043-assets-and-documents-have-first-class-subject-ownership.md'
      - 'docs/decisions/ADR-044-account-erasure-is-a-cross-store-state-machine.md'
      - 'docs/decisions/ADR-045-audit-and-outbox-track-data-subject-separately-from-actor.md'
      - 'docs/decisions/ADR-046-domain-event-transport-retention-is-bounded-and-receipted.md'
      - 'docs/decisions/ADR-047-account-evidence-retention-minimizes-audit-and-clears-outbox-transport.md'
      - 'docs/decisions/ADR-048-keycloak-identity-management-is-a-separate-least-privilege-adapter.md'
      - '.github/workflows/ownership.yml'
  pull_request:
    paths:
      - 'services/core/**'
      - 'services/worker/**'
      - 'infrastructure/keycloak/**'
      - 'infrastructure/openbao/**'
      - 'scripts/smoke/multi_user_ownership.py'
      - 'scripts/smoke/multi_user_conversation_ownership.py'
      - 'scripts/smoke/multi_user_secret_ownership.py'
      - 'scripts/smoke/multi_user_tool_invocation_ownership.py'
      - 'scripts/smoke/multi_user_asset_document_ownership.py'
      - 'scripts/smoke/multi_user_account_lifecycle.py'
      - 'scripts/smoke/tool_invocation_ownership_contract.py'
      - 'scripts/smoke/asset_document_ownership_contract.py'
      - 'scripts/smoke/evidence_subject_contract.py'
      - 'scripts/smoke/evidence_retention_contract.py'
      - 'scripts/smoke/outbox_jetstream_retention_contract.py'
      - 'scripts/smoke/internal_task_start_contract.py'
      - 'scripts/smoke/keycloak_identity_boundary_contract.py'
      - 'scripts/smoke/openbao_policy_contract.py'
      - 'scripts/smoke/control_plane_visibility.py'
      - 'compose.yaml'
      - 'compose.override.yaml'
      - '.env.example'
      - 'docs/decisions/ADR-040-canonical-world-is-scoped-by-authenticated-subject.md'
      - 'docs/decisions/ADR-041-secret-references-are-subject-owned-write-only-vault-handles.md'
      - 'docs/decisions/ADR-042-tool-invocations-are-subject-owned-execution-state.md'
      - 'docs/decisions/ADR-043-assets-and-documents-have-first-class-subject-ownership.md'
      - 'docs/decisions/ADR-044-account-erasure-is-a-cross-store-state-machine.md'
      - 'docs/decisions/ADR-045-audit-and-outbox-track-data-subject-separately-from-actor.md'
      - 'docs/decisions/ADR-046-domain-event-transport-retention-is-bounded-and-receipted.md'
      - 'docs/decisions/ADR-047-account-evidence-retention-minimizes-audit-and-clears-outbox-transport.md'
      - 'docs/decisions/ADR-048-keycloak-identity-management-is-a-separate-least-privilege-adapter.md'
      - '.github/workflows/ownership.yml'

concurrency:
  group: ownership-${{ github.ref }}
  cancel-in-progress: true

jobs:
  two-user-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Prepare authenticated ownership environment
        run: |
          cp .env.example .env
          echo 'KAIRO_WORKER_EXTRAS=' >> .env

      - name: Compile ownership-sensitive Core, Worker and proofs
        run: |
          python -m compileall services/core/src services/core/migrations/versions services/worker/src scripts/smoke/multi_user_ownership.py scripts/smoke/multi_user_conversation_ownership.py scripts/smoke/multi_user_secret_ownership.py scripts/smoke/multi_user_tool_invocation_ownership.py scripts/smoke/multi_user_asset_document_ownership.py scripts/smoke/multi_user_account_lifecycle.py scripts/smoke/tool_invocation_ownership_contract.py scripts/smoke/asset_document_ownership_contract.py scripts/smoke/evidence_subject_contract.py scripts/smoke/evidence_retention_contract.py scripts/smoke/outbox_jetstream_retention_contract.py scripts/smoke/internal_task_start_contract.py scripts/smoke/keycloak_identity_boundary_contract.py scripts/smoke/openbao_policy_contract.py scripts/smoke/control_plane_visibility.py

      - name: Prove least-privilege OpenBao workload policy
        run: python scripts/smoke/openbao_policy_contract.py

      - name: Prove Asset/Document canonical ownership contract
        run: python scripts/smoke/asset_document_ownership_contract.py

      - name: Prove ToolInvocation ownership contract
        run: python scripts/smoke/tool_invocation_ownership_contract.py

      - name: Prove Audit/Outbox data-subject contract
        run: python scripts/smoke/evidence_subject_contract.py

      - name: Prove account Audit/Outbox retention contract
        run: python scripts/smoke/evidence_retention_contract.py

      - name: Prove bounded JetStream retention and publication receipts
        run: python scripts/smoke/outbox_jetstream_retention_contract.py

      - name: Prove Worker uses the internal Task start trust boundary
        run: python scripts/smoke/internal_task_start_contract.py

      - name: Prove Keycloak identity-management boundary
        run: python scripts/smoke/keycloak_identity_boundary_contract.py

      - name: Start one shared database with two real Keycloak identities
        run: |
          docker compose up -d --build postgres nats seaweedfs temporal-admin-tools temporal temporal-create-namespace openbao keycloak kairo-core

      - name: Prove deployment diagnostics stay admin-only
        run: python scripts/smoke/control_plane_visibility.py

      - name: Prove canonical Project/Task/Graph ownership isolation
        run: python scripts/smoke/multi_user_ownership.py

      - name: Prove Assistant/News/Memory ownership isolation
        run: python scripts/smoke/multi_user_conversation_ownership.py

      - name: Prove Asset/Document ownership isolation
        run: python scripts/smoke/multi_user_asset_document_ownership.py

      - name: Prove SecretReference/Automation/Finance ownership isolation
        run: python scripts/smoke/multi_user_secret_ownership.py

      - name: Prove ToolInvocation owner/idempotency isolation
        run: python scripts/smoke/multi_user_tool_invocation_ownership.py

      - name: Prove account inventory/export/preflight isolation
        run: python scripts/smoke/multi_user_account_lifecycle.py

      - name: Dump ownership stack on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=600 postgres nats temporal temporal-create-namespace openbao keycloak kairo-core

      - name: Tear down ownership stack
        if: always()
        run: docker compose down -v --remove-orphans
