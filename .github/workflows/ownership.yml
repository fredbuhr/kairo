name: Ownership isolation validation

on:
  push:
    paths:
      - 'services/core/**'
      - 'infrastructure/keycloak/**'
      - 'scripts/smoke/multi_user_ownership.py'
      - 'scripts/smoke/multi_user_conversation_ownership.py'
      - 'scripts/smoke/multi_user_secret_ownership.py'
      - 'scripts/smoke/tool_invocation_ownership_contract.py'
      - 'compose.yaml'
      - 'compose.override.yaml'
      - '.env.example'
      - 'docs/decisions/ADR-040-canonical-world-is-scoped-by-authenticated-subject.md'
      - 'docs/decisions/ADR-041-secret-references-are-subject-owned-write-only-vault-handles.md'
      - 'docs/decisions/ADR-042-tool-invocations-are-subject-owned-execution-state.md'
      - '.github/workflows/ownership.yml'
  pull_request:
    paths:
      - 'services/core/**'
      - 'infrastructure/keycloak/**'
      - 'scripts/smoke/multi_user_ownership.py'
      - 'scripts/smoke/multi_user_conversation_ownership.py'
      - 'scripts/smoke/multi_user_secret_ownership.py'
      - 'scripts/smoke/tool_invocation_ownership_contract.py'
      - 'compose.yaml'
      - 'compose.override.yaml'
      - '.env.example'
      - 'docs/decisions/ADR-040-canonical-world-is-scoped-by-authenticated-subject.md'
      - 'docs/decisions/ADR-041-secret-references-are-subject-owned-write-only-vault-handles.md'
      - 'docs/decisions/ADR-042-tool-invocations-are-subject-owned-execution-state.md'
      - '.github/workflows/ownership.yml'

concurrency:
  group: ownership-${{ github.ref }}
  cancel-in-progress: true

jobs:
  two-user-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Prepare authenticated ownership environment
        run: |
          cp .env.example .env
          echo 'KAIRO_WORKER_EXTRAS=' >> .env

      - name: Compile ownership-sensitive Core and proofs
        run: |
          python -m compileall services/core/src services/core/migrations/versions scripts/smoke/multi_user_ownership.py scripts/smoke/multi_user_conversation_ownership.py scripts/smoke/multi_user_secret_ownership.py scripts/smoke/tool_invocation_ownership_contract.py

      - name: Prove ToolInvocation ownership contract
        run: python scripts/smoke/tool_invocation_ownership_contract.py

      - name: Start one shared database with two real Keycloak identities
        run: |
          docker compose up -d --build postgres nats seaweedfs temporal-admin-tools temporal temporal-create-namespace openbao keycloak kairo-core

      - name: Prove canonical Project/Task/Graph ownership isolation
        run: python scripts/smoke/multi_user_ownership.py

      - name: Prove Assistant/News/Memory ownership isolation
        run: python scripts/smoke/multi_user_conversation_ownership.py

      - name: Prove SecretReference/Automation/Finance ownership isolation
        run: python scripts/smoke/multi_user_secret_ownership.py

      - name: Dump ownership stack on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=600 postgres nats temporal temporal-create-namespace openbao keycloak kairo-core

      - name: Tear down ownership stack
        if: always()
        run: docker compose down -v --remove-orphans
