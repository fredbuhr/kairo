name: Baseline reproducibility validation

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: reproducibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: astral-sh/setup-uv@v6

      - name: Prove pnpm lockfile is complete and frozen
        run: pnpm install --frozen-lockfile

      - name: Prove uv workspace lockfile matches declarations
        run: uv lock --check

      - name: Compile reproducibility contract
        run: python -m compileall scripts/smoke/reproducibility_contract.py

      - name: Prove reproducibility baseline cannot drift silently
        run: python scripts/smoke/reproducibility_contract.py

      - name: Prepare locked container build environment
        run: cp .env.example .env

      - name: Prove KAIRO containers build from canonical locked graphs
        env:
          KAIRO_WORKER_EXTRAS: ""
        run: docker compose build kairo-core kairo-worker kairo-realtime kairo-web

      - name: Prove built Web serves static routes as a non-root user
        run: |
          docker compose up -d --no-deps kairo-web
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5173/projects/fixture)" = 200
          test "$(curl -s -X POST -o /dev/null -w '%{http_code}' http://127.0.0.1:5173/)" = 405
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5173/server.mjs)" = 404
          test "$(docker compose exec -T kairo-web id -u)" != 0
      - name: Stop static Web proof
        if: always()
        run: docker compose down --remove-orphans
