name: Autonomous research validation

on:
  push:
  pull_request:

concurrency:
  group: autonomous-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Import Core with research router
        run: uv run --project services/core python -c "from kairo_core.main import app; assert app.title == 'KAIRO Core'"
      - name: Prove bounded PydanticAI research planner and grounded synthesis
        run: uv run --project services/worker python scripts/smoke/research_agent_contract.py
      - name: Prove canonical document-context query contract
        run: uv run --project services/core python scripts/smoke/research_document_context_contract.py
      - name: Prove first-party Web MCP read-only contract
        run: uv run --project services/worker python scripts/smoke/web_mcp_contract.py
      - name: Compile crash/replay fixtures
        run: |
          python -m py_compile \
            scripts/smoke/fake_research_litellm.py \
            scripts/smoke/fake_research_mcp.py \
            scripts/smoke/research_crash_replay.py
      - name: Validate Web MCP Compose overlay
        run: |
          cp .env.example .env
          docker compose -f compose.yaml -f compose.web-mcp.yaml config >/dev/null
      - name: Validate Research crash Compose overlay
        run: docker compose -f compose.yaml -f compose.research-crash.yaml config >/dev/null

  research-core-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare research environment
        run: |
          cp .env.example .env
          echo 'KAIRO_AUTH_ENABLED=false' >> .env
          echo 'KAIRO_WORKER_EXTRAS=' >> .env
      - name: Start canonical research substrate
        run: docker compose up -d --build postgres nats seaweedfs temporal-admin-tools temporal temporal-create-namespace kairo-core
      - name: Prove read-only A1 research boundary and canonical result contract
        run: python scripts/smoke/research_boundary.py
      - name: Dump research state on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=500 postgres nats seaweedfs temporal-admin-tools temporal temporal-create-namespace kairo-core
      - name: Tear down research stack
        if: always()
        run: docker compose down -v --remove-orphans

  research-crash-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Prepare deterministic crash environment
        run: |
          cp .env.example .env
          echo 'KAIRO_WORKER_EXTRAS=' >> .env
      - name: Start Research crash topology
        run: |
          docker compose -f compose.yaml -f compose.research-crash.yaml up -d --build \
            postgres nats seaweedfs temporal-admin-tools temporal temporal-create-namespace \
            kairo-core fake-research-litellm fake-research-mcp kairo-worker
      - name: Prove real Worker SIGKILL replay invariants
        run: python scripts/smoke/research_crash_replay.py
      - name: Dump crash replay state on failure
        if: failure()
        run: |
          docker compose -f compose.yaml -f compose.research-crash.yaml ps -a
          docker compose -f compose.yaml -f compose.research-crash.yaml logs --no-color --tail=800 \
            postgres nats seaweedfs temporal-admin-tools temporal temporal-create-namespace \
            kairo-core kairo-worker fake-research-litellm fake-research-mcp
      - name: Tear down crash replay stack
        if: always()
        run: docker compose -f compose.yaml -f compose.research-crash.yaml down -v --remove-orphans
