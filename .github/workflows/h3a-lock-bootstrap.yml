name: H3a lockfile bootstrap

on:
  push:
    branches:
      - hardening/h3a-dependency-locks

permissions:
  contents: write

jobs:
  generate-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/h3a-dependency-locks

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: astral-sh/setup-uv@v6

      - name: Generate deterministic workspace lockfiles
        run: |
          pnpm install --lockfile-only
          uv lock

      - name: Commit generated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml uv.lock
          if git diff --cached --quiet; then
            echo "Lockfiles already current."
            exit 0
          fi
          git commit -m "H3a: generate dependency lockfiles"
          git push origin HEAD:hardening/h3a-dependency-locks
