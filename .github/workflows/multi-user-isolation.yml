name: Multi-user isolation validation

on:
  push:
  pull_request:

concurrency:
  group: multi-user-isolation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owner-boundary-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Prepare authenticated integration environment
        run: |
          cp .env.example .env
          echo 'KAIRO_WORKER_EXTRAS=' >> .env
          echo 'KAIRO_MEMORY_PROJECTOR_MODE=stub' >> .env

      - name: Start identity and canonical control plane
        run: |
          docker compose up -d --build \
            postgres nats seaweedfs temporal-admin-tools temporal temporal-create-namespace \
            keycloak kairo-core kairo-worker

      - name: Prove authenticated user-world isolation
        run: python scripts/smoke/multi_user_isolation.py

      - name: Dump isolation state on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=650 \
            postgres nats seaweedfs temporal-admin-tools temporal temporal-create-namespace \
            keycloak kairo-core kairo-worker

      - name: Tear down isolation stack
        if: always()
        run: docker compose down -v --remove-orphans
