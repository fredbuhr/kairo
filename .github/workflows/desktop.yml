name: Desktop validation

on:
  push:
    paths:
      - 'apps/desktop/**'
      - 'apps/web/package.json'
      - 'apps/web/src/lib/desktopBridge.ts'
      - 'apps/web/src/lib/authSession.ts'
      - 'apps/web/src/lib/automationApi.ts'
      - 'apps/web/src/lib/accountApi.ts'
      - 'apps/web/src/features/desktop/**'
      - 'apps/web/src/features/settings/**'
      - 'apps/web/src/features/auth/**'
      - 'apps/web/src/features/graph/useGraphActivity.ts'
      - 'apps/web/src/features/graph/LiveGraphBridge.tsx'
      - 'apps/web/src/features/assistant/useAssistant.ts'
      - 'apps/web/src/app/KairoCockpit.tsx'
      - 'apps/web/src/desktop-runtime.css'
      - 'apps/web/src/account-lifecycle.css'
      - 'apps/web/src/auth.css'
      - 'apps/web/src/main.tsx'
      - 'infrastructure/keycloak/kairo-realm.json'
      - 'compose.override.yaml'
      - '.env.example'
      - 'package.json'
      - 'docs/decisions/ADR-038-desktop-reuses-cockpit-and-bounds-native-capabilities.md'
      - 'docs/decisions/ADR-039-web-and-desktop-share-in-memory-keycloak-session.md'
      - 'docs/decisions/ADR-041-secret-references-are-subject-owned-write-only-vault-handles.md'
      - 'docs/decisions/ADR-044-account-erasure-is-a-cross-store-state-machine.md'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/web/package.json'
      - 'apps/web/src/lib/desktopBridge.ts'
      - 'apps/web/src/lib/authSession.ts'
      - 'apps/web/src/lib/automationApi.ts'
      - 'apps/web/src/lib/accountApi.ts'
      - 'apps/web/src/features/desktop/**'
      - 'apps/web/src/features/settings/**'
      - 'apps/web/src/features/auth/**'
      - 'apps/web/src/features/graph/useGraphActivity.ts'
      - 'apps/web/src/features/graph/LiveGraphBridge.tsx'
      - 'apps/web/src/features/assistant/useAssistant.ts'
      - 'apps/web/src/app/KairoCockpit.tsx'
      - 'apps/web/src/desktop-runtime.css'
      - 'apps/web/src/account-lifecycle.css'
      - 'apps/web/src/auth.css'
      - 'apps/web/src/main.tsx'
      - 'infrastructure/keycloak/kairo-realm.json'
      - 'compose.override.yaml'
      - '.env.example'
      - 'package.json'
      - 'docs/decisions/ADR-038-desktop-reuses-cockpit-and-bounds-native-capabilities.md'
      - 'docs/decisions/ADR-039-web-and-desktop-share-in-memory-keycloak-session.md'
      - 'docs/decisions/ADR-041-secret-references-are-subject-owned-write-only-vault-handles.md'
      - 'docs/decisions/ADR-044-account-erasure-is-a-cross-store-state-machine.md'
      - '.github/workflows/desktop.yml'

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck shared KAIRO Web
        run: pnpm --filter @kairo/web typecheck

      - name: Build shared KAIRO Web
        run: pnpm --filter @kairo/web build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: Check Tauri native bridge
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build Tauri app without installer bundle
        run: pnpm --filter @kairo/desktop tauri build --debug --no-bundle
