name: MCP tool registry validation

on:
  push:
  pull_request:

concurrency:
  group: mcp-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp-sdk-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Prove uv workspace lockfile matches declarations
        run: uv lock --check
      - name: Prove MCP SDK v2 client/tool contract
        run: uv run --locked --project services/worker python scripts/smoke/mcp_tool_contract.py
      - name: Prove tool replay and failure propagation stay bound to the executing Task
        run: uv run --locked --project services/worker python scripts/smoke/tool_task_binding_contract.py

  tool-registry-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Prepare registry environment
        run: |
          cp .env.example .env
          echo 'KAIRO_AUTH_ENABLED=false' >> .env
          echo 'KAIRO_WORKER_EXTRAS=' >> .env

      - name: Start canonical registry substrate
        run: |
          docker compose up -d --build postgres nats seaweedfs temporal-admin-tools temporal temporal-create-namespace kairo-core

      - name: Prove canonical MCP registry and deny-by-default policy
        run: python scripts/smoke/tool_registry.py

      - name: Dump registry state on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=500 postgres nats seaweedfs temporal-admin-tools temporal temporal-create-namespace kairo-core

      - name: Tear down registry stack
        if: always()
        run: docker compose down -v --remove-orphans
