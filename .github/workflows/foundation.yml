name: Foundation validation

on:
  push:
  pull_request:

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare development environment
        run: cp .env.example .env

      - name: Validate Compose topology
        run: |
          docker compose config >/dev/null
          docker compose -f compose.yaml -f compose.test-noauth.yaml config >/dev/null

      - name: Validate production and operations topologies
        run: |
          docker compose --env-file .env.production.example -f compose.yaml -f compose.production.yaml config >/dev/null
          docker compose --env-file .env.production.example -f compose.yaml -f compose.production.yaml -f compose.ops.yaml --profile ops config >/dev/null

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck protocol package
        run: pnpm --filter @kairo/protocol typecheck

      - name: Typecheck graph package
        run: pnpm --filter @kairo/graph typecheck

      - name: Typecheck Gantt package
        run: pnpm --filter @kairo/gantt typecheck

      - name: Typecheck UI package
        run: pnpm --filter @kairo/ui typecheck

      - name: Typecheck realtime service
        run: pnpm --filter @kairo/realtime typecheck

      - name: Typecheck KAIRO Web
        run: pnpm --filter @kairo/web typecheck

      - name: Build KAIRO Web
        run: pnpm build:web

      - name: Build realtime service
        run: pnpm build:realtime

      - uses: astral-sh/setup-uv@v6

      - name: Prove uv workspace lockfile matches declarations
        run: uv lock --check

      - name: Validate Python packages
        run: |
          uv build --package kairo-core
          uv build --package kairo-worker

      - name: Compile Python sources
        run: python -m compileall services/core/src services/worker/src scripts/smoke

      - name: Prove memory Task completion synchronization
        run: python scripts/smoke/memory_projection_wait_contract.py

      - name: Prove deterministic conversational routing
        run: uv run --locked --project services/core python scripts/smoke/assistant_router.py

      - name: Prove Assistant conversation ownership contract
        run: uv run --locked --project services/core python scripts/smoke/assistant_ownership_contract.py

      - name: Prove PydanticAI semantic routing contract
        run: uv run --locked --project services/worker python scripts/smoke/semantic_router_contract.py

      - name: Prove LiteLLM accounting contract
        run: uv run --locked --project services/worker python scripts/smoke/model_gateway_contract.py

      - name: Prove News Intelligence contract
        run: uv run --locked --project services/worker python scripts/smoke/news_contract.py

  capacity-and-data-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: kairo
          POSTGRES_PASSWORD: kairo-test-only
          POSTGRES_DB: kairo_admission_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kairo -d kairo_admission_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://kairo:kairo-test-only@localhost:5432/kairo_admission_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Apply canonical migrations to isolated PostgreSQL
        working-directory: services/core
        run: uv run --locked alembic upgrade head
      - name: Prove concurrent model admission, budgets, expiry and settlement
        run: uv run --locked --project services/core python scripts/smoke/model_admission_contract.py
      - name: Prove shared capacity, bounded reads, rebuild and relay recovery
        run: uv run --locked --project services/core python scripts/smoke/capacity_and_data_contract.py
      - name: Prove D02 migration rollback and reapply on the disposable database
        working-directory: services/core
        run: |
          uv run --locked alembic downgrade 0012_task_planning
          uv run --locked alembic upgrade head

  command-kernel-integration:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Prepare command-kernel environment
        run: |
          cp .env.example .env
          echo 'KAIRO_WORKER_EXTRAS=' >> .env

      - name: Start canonical command and Temporal substrate
        run: |
          docker compose -f compose.yaml -f compose.test-noauth.yaml up -d --build postgres nats seaweedfs temporal-admin-tools temporal temporal-create-namespace kairo-core

      - name: Prove canonical conversation and command handoff
        run: python scripts/smoke/command_kernel.py

      - name: Dump command-kernel state on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=350 postgres nats seaweedfs temporal-admin-tools temporal temporal-create-namespace kairo-core

      - name: Tear down command-kernel stack
        if: always()
        run: docker compose down -v --remove-orphans

  semantic-command-integration:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Prepare semantic-routing environment
        run: |
          cp .env.example .env
          echo 'KAIRO_WORKER_EXTRAS=' >> .env

      - name: Start canonical command, policy and Worker substrate
        run: |
          docker compose -f compose.yaml -f compose.test-noauth.yaml up -d --build postgres nats seaweedfs temporal-admin-tools temporal temporal-create-namespace kairo-core kairo-worker

      - name: Start deterministic LiteLLM stand-in
        run: |
          docker run -d --name kairo-fake-litellm \
            --network kairo_kairo \
            --network-alias litellm \
            -v "$PWD/scripts/smoke/fake_litellm.py:/app/server.py:ro" \
            python:3.12-alpine python /app/server.py

      - name: Prove durable PydanticAI routing and replay-safe capability handoff
        run: python scripts/smoke/semantic_command.py

      - name: Dump semantic-routing state on failure
        if: failure()
        run: |
          docker compose ps -a
          docker logs kairo-fake-litellm || true
          docker compose logs --no-color --tail=500 postgres nats temporal-admin-tools temporal temporal-create-namespace kairo-core kairo-worker

      - name: Tear down semantic-routing stack
        if: always()
        run: |
          docker rm -f kairo-fake-litellm || true
          docker compose down -v --remove-orphans

  memory-projection-integration:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Prepare memory-projection environment
        run: |
          cp .env.example .env
          echo 'KAIRO_WORKER_EXTRAS=' >> .env
          echo 'KAIRO_MEMORY_PROJECTOR_MODE=stub' >> .env

      - name: Start canonical message, event and Worker substrate
        run: |
          docker compose -f compose.yaml -f compose.test-noauth.yaml up -d --build postgres nats seaweedfs temporal-admin-tools temporal temporal-create-namespace kairo-core kairo-worker

      - name: Prove rebuildable memory projection generations
        run: python scripts/smoke/memory_projection.py

      - name: Dump memory-projection state on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=650 postgres nats temporal-admin-tools temporal temporal-create-namespace kairo-core kairo-worker

      - name: Tear down memory-projection stack
        if: always()
        run: docker compose down -v --remove-orphans

  block1-integration:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Prepare integration environment
        run: |
          cp .env.example .env
          echo 'KAIRO_WORKER_EXTRAS=' >> .env

      - name: Start Block 1 substrate
        run: |
          docker compose -f compose.yaml -f compose.test-noauth.yaml up -d --build postgres nats seaweedfs temporal-admin-tools temporal temporal-create-namespace kairo-core kairo-worker

      - name: Prove crash recovery and outbox delivery
        run: python scripts/smoke/block1.py

      - name: Dump service state on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=300 postgres nats seaweedfs temporal-admin-tools temporal temporal-create-namespace kairo-core kairo-worker

      - name: Tear down integration stack
        if: always()
        run: docker compose down -v --remove-orphans

  resource-integration:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Prepare trust-boundary environment
        run: |
          cp .env.example .env
          echo 'KAIRO_WORKER_EXTRAS=' >> .env

      - name: Start identity, secrets, assets and Core substrate
        run: |
          docker compose up -d --build postgres nats seaweedfs temporal-admin-tools temporal temporal-create-namespace openbao keycloak kairo-core

      - name: Prove authenticated resource boundaries
        run: python scripts/smoke/resources.py

      - name: Dump trust-boundary state on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=400 postgres nats seaweedfs temporal-admin-tools temporal temporal-create-namespace openbao keycloak kairo-core

      - name: Tear down integration stack
        if: always()
        run: docker compose down -v --remove-orphans

  backup-restore-integration:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Prepare disaster-recovery environment
        run: |
          cp .env.example .env
          cat >> .env <<'EOF'
          RESTIC_REPOSITORY=/repository
          RESTIC_PASSWORD=kairo-ci-restic-proof
          RESTIC_LOCAL_PATH=./backups/restic
          EOF

      - name: Prove Restic backup and destructive restore
        run: bash scripts/smoke/backup_restore.sh

      - name: Dump recovery state on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=250 postgres nats seaweedfs

      - name: Tear down recovery stack
        if: always()
        run: |
          docker compose --env-file .env -f compose.yaml -f compose.override.yaml -f compose.ops.yaml --profile ops run --rm ops-cleanup || true
          docker compose --env-file .env -f compose.yaml -f compose.override.yaml -f compose.ops.yaml --profile ops down -v --remove-orphans
          rm -rf backups/restic .kairo-backup-staging

  block2-policy-integration:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Prepare autonomy-boundary environment
        run: |
          cp .env.example .env
          echo 'KAIRO_WORKER_EXTRAS=' >> .env

      - name: Start durable execution, identity and Core policy substrate
        run: |
          docker compose up -d --build postgres nats seaweedfs temporal-admin-tools temporal temporal-create-namespace keycloak kairo-core kairo-worker

      - name: Prove approval suspension, hard budgets and policy tokens
        run: python scripts/smoke/block2_policy.py

      - name: Dump autonomy-boundary state on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=450 postgres nats temporal-admin-tools temporal temporal-create-namespace keycloak kairo-core kairo-worker

      - name: Tear down autonomy stack
        if: always()
        run: docker compose down -v --remove-orphans
