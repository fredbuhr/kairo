name: kairo

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    init: true
    cpus: 2.0
    mem_limit: 4g
    pids_limit: 256
    stop_grace_period: 30s
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [kairo]

  neo4j:
    profiles: [memory]
    image: neo4j:5.26-community@sha256:22ec5cd05a8cbb372fc4bed5e384c30bc75fd92504c72be4462039761b105f61
    init: true
    cpus: 2.0
    mem_limit: 4g
    pids_limit: 256
    stop_grace_period: 30s
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    networks: [kairo]

  valkey:
    profiles: [search, automation, observability]
    image: valkey/valkey:8.1.10-alpine@sha256:d2e18f3410b6f616de1417f570fa55261af2898b9c5b2cfb6781ce2373ea43d1
    init: true
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 30s
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey_data:/data
    networks: [kairo]

  nats:
    image: nats:2.14.5-alpine@sha256:d4ac35882ac65aff236cd65b9d3fa4d24332c681e1a85f94eedccd3cdd65b1da
    init: true
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 30s
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [kairo]

  seaweedfs:
    image: chrislusf/seaweedfs:4.46@sha256:08d516132314207d10c8e37cbffc1f32b147d870169688734cc61c6231625b62
    init: true
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 30s
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333"]
    ports:
      - "127.0.0.1:9333:9333"
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweed_data:/data
    networks: [kairo]

  temporal-admin-tools:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION}@sha256:dbc5fcd6ee8f0f4d808bf765af9a87dea9d8a283abfdcfbd2fc148496ba66107
    init: true
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 30s
    restart: on-failure:6
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
      SQL_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infrastructure/temporal/scripts:/scripts:ro
    entrypoint: ["/bin/sh"]
    command: ["/scripts/setup-postgres.sh"]
    networks: [kairo]

  temporal:
    image: temporalio/server:${TEMPORAL_VERSION}@sha256:b5ecdb8282bededae2a10c36e8d862e27d0bc2d247fc73c5416025997ab4a1da
    init: true
    cpus: 2.0
    mem_limit: 4g
    pids_limit: 256
    stop_grace_period: 30s
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    depends_on:
      temporal-admin-tools:
        condition: service_completed_successfully
    volumes:
      - ./infrastructure/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    ports:
      - "127.0.0.1:7233:7233"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 60
    networks: [kairo]

  temporal-create-namespace:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION}@sha256:dbc5fcd6ee8f0f4d808bf765af9a87dea9d8a283abfdcfbd2fc148496ba66107
    init: true
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 30s
    restart: on-failure:5
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      DEFAULT_NAMESPACE: default
      DEFAULT_NAMESPACE_RETENTION: 24h
    depends_on:
      temporal:
        condition: service_healthy
    volumes:
      - ./infrastructure/temporal/scripts:/scripts:ro
    entrypoint: ["/bin/sh"]
    command: ["/scripts/create-namespace.sh"]
    networks: [kairo]

  temporal-ui:
    profiles: [admin]
    image: temporalio/ui:${TEMPORAL_UI_VERSION}@sha256:810eba47f77a89b0e64e2e751478ca585d037bbd90c0951a2974a92a6c5adeb9
    init: true
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 30s
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      temporal:
        condition: service_healthy
    ports:
      - "127.0.0.1:8233:8080"
    networks: [kairo]

  openbao:
    image: openbao/openbao:2.6.2@sha256:11fd73a2102cda9c55d5d881a8c3210303146a7ec1e8ac76f526e175c6d24641
    init: true
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 30s
    restart: unless-stopped
    cap_add: [IPC_LOCK]
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${OPENBAO_DEV_TOKEN}
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: ["server", "-dev"]
    ports:
      - "127.0.0.1:8200:8200"
    networks: [kairo]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3@sha256:ff4257d0d64efbe99ed1ddfaf07765cc3c36dc7518bf8324d41961327f441c54
    init: true
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 30s
    restart: unless-stopped
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    networks: [kairo]

  litellm:
    profiles: [ai]
    image: ghcr.io/berriai/litellm:main-latest@sha256:29a0daf2593d5eaee14e76f851c4e6802cc1bf22770691a76d48e9810075ffd0
    init: true
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 30s
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/litellm
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
    volumes:
      - ./infrastructure/litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    networks: [kairo]

  activepieces:
    profiles: [automation]
    image: ghcr.io/activepieces/activepieces:0.86.3@sha256:208517c4f0d798a477a0c594bf432dd0f4918433f4b6f5b5f188a6e10e638c6c
    init: true
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 30s
    restart: unless-stopped
    environment:
      AP_CONTAINER_TYPE: WORKER_AND_APP
      AP_DB_TYPE: POSTGRES
      AP_POSTGRES_HOST: postgres
      AP_POSTGRES_PORT: 5432
      AP_POSTGRES_DATABASE: activepieces
      AP_POSTGRES_USERNAME: ${POSTGRES_USER}
      AP_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AP_REDIS_TYPE: STANDALONE
      AP_REDIS_HOST: valkey
      AP_REDIS_PORT: 6379
      AP_FRONTEND_URL: http://localhost:8080
      AP_EXECUTION_MODE: SANDBOX_CODE_ONLY
      AP_ENCRYPTION_KEY: ${ACTIVEPIECES_ENCRYPTION_KEY}
      AP_JWT_SECRET: ${ACTIVEPIECES_JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - activepieces_cache:/usr/src/app/cache
    networks: [kairo]

  searxng:
    profiles: [search]
    image: ghcr.io/searxng/searxng:2026.9.7-3e454637f@sha256:1dab138ea70a8ceb4d1c182f5c8f256088406c1742b99e279976157dbe1e9759
    init: true
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 30s
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_VALKEY_URL: valkey://valkey:6379/0
      SEARXNG_LIMITER: "false"
    depends_on:
      valkey:
        condition: service_started
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - ./infrastructure/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng_cache:/var/cache/searxng
    networks: [kairo]

  ollama:
    profiles: [local-ai]
    image: ollama/ollama:0.33.3@sha256:32931b46719f673c05fdbaa81ccb26da18ea4a1c57590a754874ab28ba269eb2
    init: true
    cpus: 2.0
    mem_limit: 4g
    pids_limit: 256
    stop_grace_period: 30s
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks: [kairo]

  ntfy:
    profiles: [notifications]
    image: binwiederhier/ntfy:latest@sha256:6ef4b819f722fccdc036af611c4774cfdc2de821ab74fdd48bbf4c9d6f8973da
    init: true
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 30s
    restart: unless-stopped
    command: ["serve"]
    environment:
      NTFY_BASE_URL: http://localhost:8083
    ports:
      - "127.0.0.1:8083:80"
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_data:/var/lib/ntfy
    networks: [kairo]

  clickhouse:
    profiles: [observability]
    image: clickhouse/clickhouse-server:25.12@sha256:8a790dd3468db22b1d4e7b18a176f378ff5ff6053b9c48dd4ea1fa71a24c5ba6
    init: true
    cpus: 2.0
    mem_limit: 4g
    pids_limit: 256
    stop_grace_period: 30s
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    networks: [kairo]

  langfuse-worker:
    profiles: [observability]
    image: langfuse/langfuse-worker:3@sha256:93207bd67d2e789ea55fa3d47eeba065dd6b1869187127ab24201784c52b96bc
    init: true
    cpus: 2.0
    mem_limit: 4g
    pids_limit: 256
    stop_grace_period: 30s
    restart: unless-stopped
    environment: &langfuse-env
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      CLICKHOUSE_MIGRATION_URL: clickhouse://${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}@clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      REDIS_HOST: valkey
      REDIS_PORT: 6379
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: kairo-langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://seaweedfs:8333
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: kairo
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: kairo-dev
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      TELEMETRY_ENABLED: "false"
    depends_on: [postgres, valkey, clickhouse, seaweedfs]
    networks: [kairo]

  langfuse-web:
    profiles: [observability]
    image: langfuse/langfuse:3@sha256:a27fe525f52984fa6d36fd34e8b8c6e5ae4af43f34134cafc833b467fa9580ae
    init: true
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 30s
    restart: unless-stopped
    environment:
      <<: *langfuse-env
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
    depends_on: [langfuse-worker]
    ports:
      - "127.0.0.1:3000:3000"
    networks: [kairo]

  livekit:
    profiles: [voice-experimental]
    image: livekit/livekit-server:v1.13.1@sha256:2c6869d2d5ff6c9c0166f47be1c92dad6928bfecfa5e4060a6ece48db8accfa3
    init: true
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 30s
    restart: unless-stopped
    command: ["--dev", "--bind", "0.0.0.0"]
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
    networks: [kairo]

  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.8.0@sha256:d32322c61254a871e0bc9c38d4e60cd18539cf9b1a2fc8f3ae04409061d0793b
    profiles: [voice]
    init: true
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 30s
    restart: unless-stopped
    environment:
      USE_GPU: "false"
      DEFAULT_VOICE: ${KOKORO_DEFAULT_VOICE}
      ENABLE_DEBUG_ENDPOINTS: "false"
    ports:
      - "127.0.0.1:8880:8880"
    networks: [kairo]

  kairo-core:
    build:
      context: .
      dockerfile: services/core/Dockerfile
    init: true
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 30s
    restart: unless-stopped
    environment:
      KAIRO_ENV: ${KAIRO_ENV}
      KAIRO_COMPONENT_REGISTRY: /app/config/components.yaml
      KAIRO_INTERNAL_TOKEN: ${KAIRO_INTERNAL_TOKEN}
      KAIRO_CORS_ORIGINS: ${KAIRO_CORS_ORIGINS}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-5}
      DATABASE_POOL_TIMEOUT: ${DATABASE_POOL_TIMEOUT:-10}
      KAIRO_MODEL_GLOBAL_CONCURRENCY: ${KAIRO_MODEL_GLOBAL_CONCURRENCY:-8}
      KAIRO_MODEL_OWNER_CONCURRENCY: ${KAIRO_MODEL_OWNER_CONCURRENCY:-2}
      KAIRO_MODEL_GLOBAL_DAILY_BUDGET_USD: ${KAIRO_MODEL_GLOBAL_DAILY_BUDGET_USD:-50}
      KAIRO_MODEL_OWNER_DAILY_BUDGET_USD: ${KAIRO_MODEL_OWNER_DAILY_BUDGET_USD:-10}
      KAIRO_WORK_GLOBAL_CONCURRENCY: ${KAIRO_WORK_GLOBAL_CONCURRENCY:-4}
      KAIRO_WORK_OWNER_CONCURRENCY: ${KAIRO_WORK_OWNER_CONCURRENCY:-1}
      KAIRO_WORK_MAX_PENDING: ${KAIRO_WORK_MAX_PENDING:-1000}
      KAIRO_WORK_OWNER_MAX_PENDING: ${KAIRO_WORK_OWNER_MAX_PENDING:-100}
      OUTBOX_MAX_PENDING: ${OUTBOX_MAX_PENDING:-10000}
      OUTBOX_PAYLOAD_MAX_BYTES: ${OUTBOX_PAYLOAD_MAX_BYTES:-65536}
      OUTBOX_RETENTION_DAYS: ${OUTBOX_RETENTION_DAYS:-30}
      MAINTENANCE_BATCH_SIZE: ${MAINTENANCE_BATCH_SIZE:-500}
      NATS_DOMAIN_MAX_AGE_SECONDS: ${NATS_DOMAIN_MAX_AGE_SECONDS:-1209600}
      NATS_DOMAIN_MAX_BYTES: ${NATS_DOMAIN_MAX_BYTES:-268435456}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NATS_URL: nats://nats:4222
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: kairo-default
      LITELLM_URL: http://litellm:4000
      OPENBAO_ADDR: http://openbao:8200
      KOKORO_TTS_URL: http://kokoro-tts:8880
      KOKORO_DEFAULT_VOICE: ${KOKORO_DEFAULT_VOICE}
    volumes:
      - ./config/components.yaml:/app/config/components.yaml:ro
      - ./config/policies:/app/config/policies:ro
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      seaweedfs:
        condition: service_started
      temporal-create-namespace:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${KAIRO_API_PORT}:8000"
    networks: [kairo]

  kairo-worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
      args:
        KAIRO_WORKER_EXTRAS: ${KAIRO_WORKER_EXTRAS}
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    cpus: ${KAIRO_WORKER_CPUS:-2.0}
    mem_limit: ${KAIRO_WORKER_MEMORY_LIMIT:-4g}
    pids_limit: ${KAIRO_WORKER_PIDS_LIMIT:-256}
    environment:
      KAIRO_ENV: ${KAIRO_ENV}
      KAIRO_WORK_GLOBAL_CONCURRENCY: ${KAIRO_WORK_GLOBAL_CONCURRENCY:-4}
      KAIRO_WORKER_MAX_CONCURRENT_ACTIVITIES: ${KAIRO_WORKER_MAX_CONCURRENT_ACTIVITIES:-16}
      KAIRO_WORKER_MAX_CONCURRENT_WORKFLOW_TASKS: ${KAIRO_WORKER_MAX_CONCURRENT_WORKFLOW_TASKS:-8}
      KAIRO_DOCUMENT_MAX_CONCURRENT: ${KAIRO_DOCUMENT_MAX_CONCURRENT:-1}
      KAIRO_DOCUMENT_MAX_SOURCE_BYTES: ${KAIRO_DOCUMENT_MAX_SOURCE_BYTES:-26214400}
      KAIRO_DOCUMENT_MAX_TEXT_CHARS: ${KAIRO_DOCUMENT_MAX_TEXT_CHARS:-1000000}
      KAIRO_DOCUMENT_PARSE_TIMEOUT_SECONDS: ${KAIRO_DOCUMENT_PARSE_TIMEOUT_SECONDS:-180}
      KAIRO_INTERNAL_TOKEN: ${KAIRO_INTERNAL_TOKEN}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: kairo-default
      NATS_URL: nats://nats:4222
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      KAIRO_NEWS_MODEL: ${KAIRO_NEWS_MODEL}
      KAIRO_NEWS_MODEL_ESTIMATED_COST_USD: ${KAIRO_NEWS_MODEL_ESTIMATED_COST_USD:-0.01}
      KAIRO_MODEL_MAX_OUTPUT_TOKENS: ${KAIRO_MODEL_MAX_OUTPUT_TOKENS:-4096}
      KAIRO_SEMANTIC_ROUTER_MODEL: ${KAIRO_SEMANTIC_ROUTER_MODEL:-local-fast}
      KAIRO_SEMANTIC_ROUTER_ESTIMATED_COST_USD: ${KAIRO_SEMANTIC_ROUTER_ESTIMATED_COST_USD:-0.002}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      SEARXNG_URL: http://searxng:8080
      KAIRO_CORE_URL: http://kairo-core:8000
    depends_on:
      kairo-core:
        condition: service_started
      temporal-create-namespace:
        condition: service_completed_successfully
    networks: [kairo]

  kairo-realtime:
    profiles: [collaboration-experimental]
    build:
      context: .
      dockerfile: services/realtime/Dockerfile
    init: true
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 30s
    restart: unless-stopped
    environment:
      PORT: 1234
      KAIRO_ENV: ${KAIRO_ENV}
    depends_on: [kairo-core, nats]
    ports:
      - "127.0.0.1:${KAIRO_REALTIME_PORT}:1234"
    networks: [kairo]

  kairo-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    init: true
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 30s
    restart: unless-stopped
    environment:
      VITE_KAIRO_API_URL: http://localhost:${KAIRO_API_PORT}
      VITE_KAIRO_REALTIME_URL: ws://localhost:${KAIRO_REALTIME_PORT}
    depends_on: [kairo-core]
    ports:
      - "127.0.0.1:${KAIRO_WEB_PORT}:5173"
    networks: [kairo]

  rotki:
    image: rotki/rotki:latest@sha256:918e35cfbcce68633eafc9cdcc206bb2b45a1110f86e544d48d1fded04c280ff
    profiles: [finance]
    init: true
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 30s
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:80"
    volumes:
      - rotki_data:/data
      - rotki_logs:/logs
    networks: [kairo]

  actual-budget:
    image: actualbudget/actual-server:latest@sha256:552beab3dec8c93d46b8b9245612d63c3f123b8a45063a474f53e229b17621d3
    profiles: [finance]
    init: true
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 30s
    restart: unless-stopped
    ports:
      - "127.0.0.1:5006:5006"
    volumes:
      - actual_data:/data
    networks: [kairo]

  hummingbot:
    image: hummingbot/hummingbot:latest@sha256:632d2b07aa156b761310f2f7258a78c9660a1c28b6df4b33874e09a0c7d06c85
    profiles: [finance]
    init: true
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 30s
    restart: unless-stopped
    tty: true
    stdin_open: true
    volumes:
      - hummingbot_conf:/home/hummingbot/conf
      - hummingbot_logs:/home/hummingbot/logs
      - hummingbot_data:/home/hummingbot/data
    networks: [kairo]

  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:stable@sha256:612d76760b544cb40b7ba01387fdac964c59a6a550a50a4d30b4773c822d2918
    profiles: [home]
    init: true
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 30s
    restart: unless-stopped
    network_mode: host
    privileged: true
    volumes:
      - homeassistant_config:/config
      - /etc/localtime:/etc/localtime:ro

  openhands:
    image: docker.openhands.dev/openhands/openhands:1.6@sha256:5c0dc26f467bf8e47a6e76308edb7a30af4084b17e23a3460b5467008b12111b
    profiles: [dev-agent]
    init: true
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 30s
    restart: unless-stopped
    environment:
      # Enable only after resolving/reviewing the child digest; the preflight checks it too.
      AGENT_SERVER_IMAGE_REPOSITORY: ${OPENHANDS_AGENT_REPOSITORY:-ghcr.io/openhands/agent-server}
      AGENT_SERVER_IMAGE_TAG: ${OPENHANDS_AGENT_TAG:-UNCONFIGURED}
      LOG_ALL_EVENTS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - openhands_data:/.openhands
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:3001:3000"
    networks: [kairo]

  vllm:
    image: vllm/vllm-openai:latest@sha256:c2914767605584b6d8f45686b82de173ecc99e781897aa3d0a66dacd72c51ae1
    profiles: [gpu]
    init: true
    cpus: 2.0
    mem_limit: 4g
    pids_limit: 256
    stop_grace_period: 30s
    restart: unless-stopped
    gpus: all
    command: ["--model", "${VLLM_MODEL}", "--revision", "${VLLM_MODEL_REVISION:-UNCONFIGURED}"]
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    networks: [kairo]

  headscale:
    image: headscale/headscale:latest@sha256:0e7f1c6e4ce6c2a2a001103ecd3fa645a045adf30ac8a5234fe037b43000cd72
    profiles: [remote]
    init: true
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 30s
    restart: unless-stopped
    command: ["serve"]
    ports:
      - "127.0.0.1:8085:8080"
    volumes:
      - headscale_data:/var/lib/headscale
      - ./infrastructure/headscale:/etc/headscale:ro
    networks: [kairo]

networks:
  kairo:
    driver: bridge

