# D04 isolated fixtures only. Never combine this overlay with production.
services:
  postgres:
    networks: [kairo, qualification]
  neo4j:
    networks: [kairo, qualification]
    environment:
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m

  kairo-model-prepare:
    profiles: [qualification]
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    init: true
    cpus: 2
    mem_limit: 4g
    pids_limit: 256
    environment:
      HF_HOME: /models/huggingface
      FASTEMBED_CACHE_PATH: /models/fastembed
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MEM0_TELEMETRY: 'false'
    volumes:
      - ./scripts/qualification:/qualification:ro
      - ${KAIRO_QUALIFICATION_MODELS:-./.kairo-qualification/models}:/models
    command: [python, /qualification/engines.py, prepare, --models, /models]
    networks: [kairo]

  kairo-qualification:
    profiles: [qualification]
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    init: true
    cpus: 2
    mem_limit: 4g
    pids_limit: 256
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:size=536870912,mode=1777']
    environment:
      KAIRO_QUALIFICATION_SCOPE: ${KAIRO_QUALIFICATION_SCOPE:-development-host}
      KAIRO_QUALIFICATION_COMMIT: ${KAIRO_QUALIFICATION_COMMIT:-unrecorded}
      HF_HOME: /models/huggingface
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DOCLING_ARTIFACTS_PATH: /models/docling
      FASTEMBED_CACHE_PATH: /models/fastembed
      MEM0_TELEMETRY: 'false'
      MEM0_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mem0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    volumes:
      - ./scripts/qualification:/qualification:ro
      - ${KAIRO_QUALIFICATION_MODELS:-./.kairo-qualification/models}:/models:ro
      - ./.kairo-qualification/evidence:/evidence
    command: [python, /qualification/engines.py, run, --models, /models]
    networks: [qualification]

networks:
  qualification:
    internal: true
