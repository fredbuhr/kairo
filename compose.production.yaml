services:
  openbao:
    command: ["server", "-config=/openbao/config/config.hcl"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
      # Explicitly erase development-only values inherited from compose.yaml.
      BAO_DEV_ROOT_TOKEN_ID: ""
      BAO_DEV_LISTEN_ADDRESS: ""
    volumes:
      - ./infrastructure/openbao/config.hcl:/openbao/config/config.hcl:ro
      - openbao_data:/openbao/file
    healthcheck:
      test: ["CMD-SHELL", "bao status >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30

  keycloak:
    command: ["start"]
    environment:
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

  litellm:
    environment:
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_OTEL_HOST: http://langfuse-web:3000

  langfuse-worker:
    environment:
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}

  langfuse-web:
    environment:
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}

  kairo-core:
    environment:
      KAIRO_AUTH_ENABLED: "true"
      KAIRO_POLICY_SIGNING_KEY: ${KAIRO_POLICY_SIGNING_KEY}
      ASSET_MAX_BYTES: ${ASSET_MAX_BYTES}
      SEAWEED_FILER_ENDPOINT: http://seaweedfs:8888
      OPENBAO_TOKEN: ${OPENBAO_TOKEN}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs

volumes:
  openbao_data:
