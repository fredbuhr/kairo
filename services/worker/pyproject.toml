[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kairo-worker"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "temporalio>=1.16,<2",
  "pydantic-settings>=2.10,<3",
  "pydantic-ai-slim==2.41.0",
  "mcp==2.1.1",
  "httpx>=0.28,<1",
  "nats-py>=2.11,<3",
  "boto3>=1.40,<2",
  "trafilatura==2.2.0",
]

[project.optional-dependencies]
intelligence = [
  "mem0ai[vector-stores]==2.0.20",
  "fastembed>=0.3.1,<1",
  "graphiti-core==0.29.3",
  "docling",
  "browser-use",
  "playwright>=1.55,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kairo_worker"]
