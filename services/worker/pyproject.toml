[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kairo-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "temporalio>=1.15,<2",
  "pydantic-settings>=2.10,<3",
  "pydantic-ai",
  "mem0ai",
  "graphiti-core",
  "docling",
  "browser-use",
  "playwright>=1.55,<2",
  "httpx>=0.28,<1",
  "nats-py>=2.11,<3",
  "boto3>=1.40,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kairo_worker"]
