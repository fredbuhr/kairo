[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kairo-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.16,<2",
  "nats-py>=2.11,<3",
  "httpx>=0.28,<1",
  "pyyaml>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kairo_core"]
