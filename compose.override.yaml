services:
  openbao:
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    healthcheck:
      test: ["CMD-SHELL", "bao status >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30

  keycloak:
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
    volumes:
      - ./infrastructure/keycloak:/opt/keycloak/data/import:ro

  litellm:
    environment:
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_OTEL_HOST: http://langfuse-web:3000

  langfuse-worker:
    environment:
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}

  langfuse-web:
    environment:
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}

  kairo-core:
    environment:
      KAIRO_AUTH_ENABLED: ${KAIRO_AUTH_ENABLED}
      KAIRO_POLICY_SIGNING_KEY: ${KAIRO_POLICY_SIGNING_KEY}
      KAIRO_WEB_MCP_URL: http://kairo-web-mcp:8765/mcp
      ASSET_MAX_BYTES: ${ASSET_MAX_BYTES}
      SEAWEED_FILER_ENDPOINT: http://seaweedfs:8888
      OPENBAO_TOKEN: ${OPENBAO_DEV_TOKEN}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs

  kairo-web-mcp:
    build:
      context: ./services/worker
      args:
        KAIRO_WORKER_EXTRAS: ""
    restart: unless-stopped
    command: ["python", "-m", "kairo_worker.web_mcp_server"]
    environment:
      SEARXNG_URL: http://searxng:8080
    depends_on:
      searxng:
        condition: service_started
    networks: [kairo]

  kairo-web-mcp-bootstrap:
    build:
      context: ./services/worker
      args:
        KAIRO_WORKER_EXTRAS: ""
    restart: on-failure:5
    command: ["python", "-m", "kairo_worker.web_mcp_bootstrap"]
    environment:
      KAIRO_CORE_URL: http://kairo-core:8000
      KAIRO_INTERNAL_TOKEN: ${KAIRO_INTERNAL_TOKEN}
      KAIRO_WEB_MCP_URL: http://kairo-web-mcp:8765/mcp
    depends_on:
      kairo-core:
        condition: service_started
      kairo-web-mcp:
        condition: service_started
    networks: [kairo]
